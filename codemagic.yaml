workflows:
  ios-release:
    name: TabaTo iOS - Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Nome dell'integrazione App Store Connect configurata in Codemagic UI
      # (Teams > Integrations > App Store Connect): crea una API Key in
      # https://appstoreconnect.apple.com/access/api e incollala qui con questo nome.
      app_store_connect: tabato_app_store_connect

    environment:
      # NB: la firma NON usa il blocco dichiarativo "ios_signing" perché
      # accetta un solo bundle id e andrebbe in conflitto con il fetch
      # manuale del profilo per la ShareExtension (causa dell'errore
      # "Cannot save Signing Certificates without certificate private key").
      # Gestiamo quindi manualmente certificato/profili per ENTRAMBI i
      # target (App + ShareExtension) nello stesso script, cosi' il
      # certificato viene creato/riusato in un'unica sessione keychain.
      #
      # IMPORTANTE: la variabile segreta CERTIFICATE_PRIVATE_KEY_B64 (gruppo
      # "ios_signing", definita in App settings > Environment variables)
      # DEVE contenere la chiave privata RSA stabile codificata in BASE64
      # SU UNA SOLA RIGA (non la chiave PEM multilinea grezza: incollata
      # multilinea in un campo della UI rischia di perdere gli "a capo" e
      # corrompersi silenziosamente, facendo ripiombare nello stesso
      # errore "Cannot save Signing Certificates without certificate
      # private key"). Lo script sottostante la decodifica in un file
      # temporaneo e lo passa esplicitamente con --certificate-key.
      groups:
        - ios_signing
      vars:
        APP_STORE_APPLE_ID: 6821043787 # Apple ID numerico dell'app (App Store Connect)
      node: latest
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-*'
          include: true

    scripts:
      - name: Installa le dipendenze npm
        script: npm ci

      - name: Sincronizza il progetto Capacitor iOS
        script: npx cap sync ios

      - name: Installa i CocoaPods
        script: |
          cd ios/App && pod install

      - name: Imposta build number da Codemagic
        script: |
          cd ios/App
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Inizializza il keychain per la firma del codice
        script: |
          keychain initialize

      - name: Recupera certificato e profili di firma (App + ShareExtension)
        script: |
          # Decodifica la chiave privata RSA stabile (base64 su una riga,
          # vedi env var CERTIFICATE_PRIVATE_KEY_B64) in un file temporaneo,
          # cosi' da passarla esplicitamente con --certificate-key invece di
          # affidarsi alla lettura automatica della env var (che e' fragile
          # se la chiave PEM multilinea viene incollata/alterata nella UI).
          CERT_KEY_PATH="$FCI_BUILD_DIR/ios_distribution_private_key.pem"
          echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 --decode > "$CERT_KEY_PATH"

          # Entrambi i bundle id vengono risolti nella STESSA sessione:
          # se serve un nuovo certificato di distribuzione viene creato
          # una sola volta qui, e la sua chiave privata resta disponibile
          # per il passo successivo (keychain add-certificates).
          app-store-connect fetch-signing-files it.tabato.app \
            --type IOS_APP_STORE \
            --certificate-key "@file:$CERT_KEY_PATH" \
            --create
          app-store-connect fetch-signing-files it.tabato.app.ShareExtension \
            --type IOS_APP_STORE \
            --certificate-key "@file:$CERT_KEY_PATH" \
            --create

          rm -f "$CERT_KEY_PATH"

      - name: Aggiungi il certificato al keychain di sistema
        script: |
          keychain add-certificates

      - name: Build e firma (Xcode)
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Primo invio: solo upload su App Store Connect (TestFlight interno).
        # Quando l'app sarà pronta per la review pubblica, impostare:
        #   submit_to_app_store: true
        submit_to_testflight: true
        submit_to_app_store: false
